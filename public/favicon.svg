<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- 1. 背景：暗黑圆角矩形，带一圈经典霓虹绿边框 -->
  <rect width="512" height="512" rx="96" fill="#121212" stroke="#4caf50" stroke-width="24"/>
  
  <!-- 2. 内部网格纹理 (增加像素感和科技感，透明度极低) -->
  <path d="M 128 0 L 128 512 M 256 0 L 256 512 M 384 0 L 384 512 M 0 128 L 512 128 M 0 256 L 512 256 M 0 384 L 512 384" stroke="#ffffff" stroke-width="2" opacity="0.03" />

  <!-- 3. 食物 (一个红色的像素方块，代表苹果) -->
  <rect x="330" y="110" width="60" height="60" rx="8" fill="#e53935" />
  <!-- 食物上的高光像素点 -->
  <rect x="340" y="120" width="12" height="12" fill="#ffffff" opacity="0.4" />

  <!-- 4. 蛇身 (像素方块拼接，呈现一个反向的 S 形) -->
  <!-- 蛇尾 -->
  <rect x="110" y="330" width="60" height="60" rx="8" fill="#388e3c" />
  <!-- 蛇身下 -->
  <rect x="150" y="270" width="60" height="60" rx="8" fill="#388e3c" />
  <!-- 蛇身中 -->
  <rect x="210" y="210" width="60" height="60" rx="8" fill="#4caf50" />
  <!-- 蛇头上 -->
  <rect x="270" y="150" width="60" height="60" rx="8" fill="#2e7d32" />

  <!-- 5. 蛇的眼睛 (白色底，黑色瞳孔，看向右上角的食物) -->
  <!-- 左眼 -->
  <circle cx="285" cy="170" r="8" fill="#ffffff" />
  <circle cx="288" cy="170" r="4" fill="#000000" />
  <!-- 右眼 -->
  <circle cx="315" cy="170" r="8" fill="#ffffff" />
  <circle cx="318" cy="170" r="4" fill="#000000" />
  
  <!-- 6. 蛇的舌头 (一个小红叉) -->
  <path d="M 330 180 L 350 180 M 345 175 L 350 180 L 345 185" stroke="#e53935" stroke-width="4" stroke-linecap="round" fill="none" />
</svg>