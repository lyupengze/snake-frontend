# ==========================================
# Android Gradle 构建全局属性
# ==========================================

# 指定 Gradle 守护进程的 JVM 内存限制
# 对于当前轻量级 Capacitor 项目，1.5G 足够；如果后续引入大量原生 SDK 导致 OOM，可适当增大。
org.gradle.jvmargs=-Xmx1536m

# 开启并行编译模式（注意：如果项目中存在互相依赖的模块，开启此选项可能引发冲突，目前默认关闭）
# org.gradle.parallel=true

# [必须] 启用 AndroidX 库，替代旧版 Support Library
android.useAndroidX=true

# [注意] 不要在此文件中硬编码本地 JDK 路径 (如 org.gradle.java.home=C:/...)！
# 这会导致其他机器或 CI/CD 环境构建失败。请依赖环境变量或 Android Studio 自带的 JBR。