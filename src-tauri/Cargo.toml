[package]
name = "SnakeBattle"
version = "1.2.0"
description = "Snake Game Desktop Client (Tauri 2)"
authors = ["SpamtonNEO"]
license = "MIT"
repository = "https://github.com/lyupengze/snake-frontend"
edition = "2024"
rust-version = "1.90"

# 核心逻辑放在 lib 中，便于跨平台编译和移动端复用
[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }

log = "0.4"
tauri-plugin-log = "2"

# tauri-plugin-http 替代 WebView 原生 fetch，绕过 CORS 限制
tauri = { version = "2.12.5", features = [] }
tauri-plugin-http = "2"
